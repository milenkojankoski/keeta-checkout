packages:
  - 'packages/*'
  - 'examples/*'

# Build scripts we allow to run. pnpm 11 blocks postinstall scripts by default.
#   secp256k1  - native bindings for Keeta's default key algorithm
#   esbuild    - the bundler behind tsx and vitest
#   protobufjs - generates its runtime descriptors
allowBuilds:
  esbuild: true
  protobufjs: true
  secp256k1: true

# minimatch <11.0.1 has a glob-amplification DoS advisory. It reaches us only
# through eslint, which is a devDependency and never ships, but a clean audit on a
# public repository is worth more than the two lines this costs. eslint uses plain
# globbing, which 11.x keeps compatible.
overrides:
  minimatch: "^11.0.1"
