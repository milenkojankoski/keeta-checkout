packages:
  - 'packages/*'
  - 'examples/*'

# Build scripts we allow to run. pnpm 11 blocks postinstall scripts by default.
#   secp256k1  - native bindings for Keeta's default key algorithm
#   esbuild    - the bundler behind tsx and vitest
#   protobufjs - generates its runtime descriptors
allowBuilds:
  esbuild: true
  protobufjs: true
  secp256k1: true
