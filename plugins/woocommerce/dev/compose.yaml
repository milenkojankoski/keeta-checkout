# A throwaway WordPress with WooCommerce and this plugin, wired to a real Keeta
# Checkout server on the test network.
#
#   cd plugins/woocommerce/dev
#   docker compose up -d --build
#   docker compose logs -f setup      # watch it install and configure everything
#
# Then:
#   shop      http://localhost:8080
#   admin     http://localhost:8080/wp-admin  (admin / admin)
#   checkout  http://localhost:3000/health
#
# The plugin source is bind-mounted, so editing a PHP file in
# plugins/woocommerce/ takes effect on the next request. No rebuild needed.
#
# Tear it all down, database included:
#   docker compose down -v
#
# Three URLs, three different vantage points, which is the thing to understand
# here:
#
#   the browser reaches the pay page at   http://localhost:3000   (published port)
#   WordPress reaches the API at          http://checkout:3000    (compose network)
#   the server reaches the webhook at     http://wordpress        (compose network)
#
# That is why the plugin's "server URL" setting and the server's own public URL are
# deliberately different values.

name: keeta-checkout-wordpress-dev

services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 20

  # The Keeta Checkout server, built from this repository.
  checkout:
    build:
      context: ../../..
      dockerfile: docker/Dockerfile
    environment:
      KEETA_NETWORK: test
      # The development merchant wallet from `pnpm wallets:create`. A public
      # address: the server holds no key and cannot move its funds.
      KEETA_CHECKOUT_RECEIVING_ADDRESS: keeta_aabvt3ni7qohr2agcfypfjc4jaupt3i5lfyf53buw45t6btjuehjxhkqfr5u2fi
      KEETA_CHECKOUT_ACCEPTED_TOKENS: $$KTA,$$USDC
      KEETA_CHECKOUT_API_KEYS: kck_dev_0000000000000000000000
      # What the browser can reach, so hostedUrl and the QR work from the host.
      KEETA_CHECKOUT_PUBLIC_URL: http://localhost:3000
      # Where this server sends events. `wordpress` resolves on the compose network.
      KEETA_CHECKOUT_WEBHOOKS: http://wordpress/wp-json/keeta-checkout/v1/webhook|whsec_dev_00000000000000000000
      KEETA_CHECKOUT_MERCHANT_NAME: Keeta Checkout Dev Shop
      KEETA_CHECKOUT_DATABASE: /data/keeta-checkout.sqlite
      HOST: 0.0.0.0
      PORT: '3000'
    ports:
      - '3000:3000'
    volumes:
      - checkout:/data
    restart: unless-stopped

  wordpress:
    image: wordpress:7-php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DEBUG: '1'
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_HOME', 'http://localhost:8080' );
        define( 'WP_SITEURL', 'http://localhost:8080' );
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
    ports:
      - '8080:80'
    volumes:
      - wordpress:/var/www/html
      # The plugin, live from the working tree.
      - ../:/var/www/html/wp-content/plugins/keeta-checkout-for-woocommerce:ro
    restart: unless-stopped

  # One-shot: installs WordPress, WooCommerce and the plugin, then configures the
  # gateway so there is nothing to click through before testing a payment.
  setup:
    image: wordpress:cli-php8.3
    depends_on:
      wordpress:
        condition: service_started
      checkout:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    volumes:
      - wordpress:/var/www/html
      - ../:/var/www/html/wp-content/plugins/keeta-checkout-for-woocommerce:ro
      - ./setup.sh:/setup.sh:ro
    user: '33:33'
    entrypoint: ['sh', '/setup.sh']
    restart: 'no'

volumes:
  db:
  wordpress:
  checkout:
