name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # CI never touches the main network. Tests that need funds use the test faucet.
      KEETA_NETWORK: test
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      # Unit tests only. Tests that publish blocks need funded test wallets and a
      # working faucet, so they are gated behind the `network` tag and run in a
      # separate job once step 5 lands.
      - run: pnpm test
