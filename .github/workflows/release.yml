name: Release

# Pushing a `v*` tag publishes that commit:
#
#   - the container image to ghcr.io, tagged with the version and `latest`
#   - the WooCommerce plugin as a zip on a GitHub release, with the notes from
#     docs/releases/<tag>.md
#
# The npm package is published separately with `npm publish` from a checkout of
# the same tag, because that needs an npm account and this repository stores no
# npm token. Nothing here touches the main Keeta network.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      KEETA_NETWORK: test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: php plugins/woocommerce/tests/run-tests.php
      # The tag must agree with the package, or `npx keeta-checkout` and the image
      # would say different things.
      - name: Tag matches the CLI version
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} but packages/cli is $version"; exit 1; }

  image:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          # amd64 only for now: secp256k1 builds native bindings, and doing that
          # under QEMU for arm64 is slow enough to time out a first release.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the WooCommerce plugin zip
        # The folder inside the zip is the plugin slug WordPress will install it
        # under. The development stack and the tests are not part of the plugin.
        run: |
          mkdir -p build
          cp -r plugins/woocommerce build/keeta-checkout-for-woocommerce
          rm -rf build/keeta-checkout-for-woocommerce/dev build/keeta-checkout-for-woocommerce/tests
          (cd build && zip -qr keeta-checkout-for-woocommerce.zip keeta-checkout-for-woocommerce)
          unzip -l build/keeta-checkout-for-woocommerce.zip
      - uses: softprops/action-gh-release@v2
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          files: build/keeta-checkout-for-woocommerce.zip
